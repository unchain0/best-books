name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${+{'ithub.workflow'}}-${{'ithub.ref'}}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
      run: pip install uv

      - name: Install dependences
      run: uv sync --group dev

      - name: Lint
      run: uv run ruff check .