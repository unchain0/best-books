[project]
name = "best-books"
version = "0.1.0"
description = "Web scraping of site best-books.dev"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "libgen-api-enhanced>=1.2.1",
    "lxml>=6.0.2",
    "requests>=2.32.5",
    "rich>=13.7.0",
    "psutil>=6.1.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
    "types-requests>=2.32.4.20250913",
    "types-psutil>=6.1.0.20250102",
]

[tool.pytest.ini_options]
# Padrão de descoberta de testes
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Diretórios a serem testados
testpaths = ["tests"]

# Marcadores customizados
markers = [
    "network: marca testes que precisam de conexão de rede",
    "slow: marca testes lentos (downloads, etc)",
]

# Opções padrão
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

# Captura de saída
console_output_style = "progress"

[tool.mypy]

[[tool.mypy.overrides]]
module = "libgen_api_enhanced.*"
ignore_missing_imports = true
