[project]
name = "best-books"
version = "0.1.0"
description = "Web scraping of site best-books.dev"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "libgen-api-enhanced>=1.2.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.13.2",
    "types-requests>=2.32.4.20250913",
]

[[tool.mypy.overrides]]
module = "libgen_api_enhanced.*"
ignore_missing_imports = true
